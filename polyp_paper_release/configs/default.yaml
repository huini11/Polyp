model:
  name: LightPolySegNet
  image_size: 352
  stem_channels: 16
  stage_channels:
  - 32
  - 56
  - 112
  - 176
  mv2_blocks:
  - 1
  - 2
  - 2
  - 2
  tf_dims:
  - 72
  - 128
  - 176
  tf_depths:
  - 2
  - 2
  - 2
  tf_patch_size: 2
  decoder_channels:
  - 96
  - 56
  - 32
  use_boundary_head: true
data:
  aug_color: true
train:
  data_root: data/TrainDataset
  image_size: 352
  val_split: 0.1
  epochs: 100
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  lr_min: 1.0e-06
  warmup_epochs: 2
  amp: true
  num_workers: 2
  grad_clip: 1.0
  seed: 42
  w_bce: 1.0
  w_iou: 1.0
  w_boundary: 0.5
  w_aux: 0.4
  out_dir: runs/exp2
  log_every: 20
  save_every: 5
test:
  data_root: data/TestDataset
  datasets:
  - CVC-300
  - CVC-ColonDB
  - ETIS-Larib
  - Kvasir-SEG
  - CVC-ClinicDB
  threshold: 0.5
