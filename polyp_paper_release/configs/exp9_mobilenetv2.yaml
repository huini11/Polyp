# =============================================================================
# exp9 (capacity-matched pretrained CNN encoder control, reviewer request):
# pretrained timm MobileNetV2-050 encoder feeding the SAME progressive
# decoder as ours. Answers: "does the Transformer part of the hybrid
# matter once capacity and pretraining are matched against a CNN?"
#
# ImageNet weights are loaded INSIDE timm at build time (encoder); the
# decoder is randomly initialized, exactly like the main model's protocol.
# The MobileViT checkpoint loader is skipped automatically (see
# build_model_from_cfg) -- the train log will show decoder-only random
# init; that is expected.
#
# Note: backbone is ~2.4M params (larger than ours' 0.98M encoder); report
# total params alongside and discuss the residual capacity gap.
# =============================================================================

model:
  name: LightPolySegNet
  image_size: 352

  encoder_mode: timm               # <-- exp9 switch: pretrained timm backbone
  timm_encoder: mobilenetv2_100
  pretrained: false                # timm loads ImageNet itself; keep false to
                                   # avoid any mobilevit checkpoint attempt

  # fields below unused by the timm encoder but kept for decoder/layout parity
  vit_style: timm
  stem_channels: 16
  stage_channels: [24, 48, 64, 80]
  mv2_blocks: [3, 1, 1, 1]
  mv2_expand: 2
  tf_dims: [64, 80, 96]
  tf_depths: [2, 4, 3]
  tf_patch_size: 2
  tf_mlp_ratio: 2.0

  decoder_channels: [96, 56, 32]   # SAME decoder as ours
  use_boundary_head: true
  use_sobel_attention: true

data:
  aug_color: true

train:
  data_root: data/TrainDataset
  image_size: 352
  val_split: 0.0
  epochs: 100
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine
  lr_min: 1.0e-6
  warmup_epochs: 2
  amp: true
  num_workers: 2
  grad_clip: 1.0
  seed: 42

  w_bce: 1.0
  w_iou: 1.0
  w_boundary: 0.5
  w_aux: 0.4

  out_dir: runs/exp9
  log_every: 20
  save_every: 5

test:
  data_root: data/TestDataset
  datasets:
    - CVC-300
    - CVC-ColonDB
    - ETIS-Larib
    - Kvasir-SEG
    - CVC-ClinicDB
  threshold: 0.5
