# =============================================================================
# Ablation exp4: NO boundary supervision (w_boundary=0).
# ARCHITECTURE AND ALL OTHER SETTINGS ARE IDENTICAL TO configs/exp3_pretrain.yaml
# (timm-aligned MobileViT-XXS backbone + ImageNet pretrained init + color aug).
# The ONLY difference vs exp3 is w_boundary: 0.5 -> 0.0, so that
#   exp3 - exp4 = contribution of the boundary-aware loss.
#
# NOTE (2026-10-22, robustness-auditor): the previous version of this file
# still carried the v1 backbone (stage_channels [32,56,112,176]). That would
# have conflated the boundary-loss ablation with a backbone change. It has
# been rewritten to match exp3 exactly. Do not edit architecture keys here.
#
# Training protocol follows the PraNet standard:
#   train: Kvasir-SEG (1000) + CVC-ClinicDB (612)
#   test : CVC-300 (60) + CVC-ColonDB (380) + ETIS-Larib (196)
#          + Kvasir-SEG + CVC-ClinicDB
# =============================================================================

model:
  name: LightPolySegNet
  image_size: 352

  # ---- exp3 encoder: timm mobilevit_xxs aligned ----
  pretrained: true               # same ImageNet init as exp3 (NOT an ablation dim here)
  vit_style: timm                # timm-compatible MobileViT blocks
  stem_channels: 16
  stage_channels: [24, 48, 64, 80]   # = timm xxs stage outputs
  mv2_blocks: [3, 1, 1, 1]           # timm xxs: IR d=3 stage1 + 1 IR per ViT stage
  mv2_expand: 2                      # timm xxs bottle ratio 2.0
  tf_dims: [64, 80, 96]              # timm xxs transformer dims
  tf_depths: [2, 4, 3]               # timm xxs transformer depths
  tf_patch_size: 2
  tf_mlp_ratio: 2.0                  # timm xxs mlp ratio

  # ---- Boundary-aware lightweight decoder ----
  decoder_channels: [96, 56, 32]
  use_boundary_head: true        # head stays built (same param count as exp3);
                                 # only its loss weight is zeroed below, so
                                 # exp3 vs exp4 isolates the LOSS, not capacity.

data:
  aug_color: true                # same color augmentation as exp3

train:
  data_root: data/TrainDataset
  image_size: 352
  val_split: 0.1                 # overridden to 0.0 by the notebook CLI (paper protocol)

  epochs: 100
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine
  lr_min: 1.0e-6
  warmup_epochs: 2
  amp: true
  num_workers: 2
  grad_clip: 1.0
  seed: 42

  # ---- Loss weights ----
  w_bce: 1.0
  w_iou: 1.0
  w_boundary: 0.0                # <<< THE ABLATION DIM (exp3 uses 0.5)
  w_aux: 0.4

  # ---- Logging / checkpointing ----
  out_dir: runs/exp4_no_boundary # notebook CLI overrides --out-dir anyway
  log_every: 20
  save_every: 5

test:
  data_root: data/TestDataset
  datasets:
    - CVC-300
    - CVC-ColonDB
    - ETIS-Larib
    - Kvasir-SEG
    - CVC-ClinicDB
  threshold: 0.5
