# =============================================================================
# exp10 (minimal-decoder baseline, reviewer request): MobileViT-XXS-aligned
# encoder + a minimal FPN decoder (lateral 1x1 + top-down add + 3x3 smooth).
# Answers: "how much does the paper's progressive fusion + boundary-branch
# decoder add over the simplest reasonable decoder?"
#
# No boundary head, no Sobel attention, no auxiliary deep supervision is
# REMOVED here -- aux heads are kept because train.py expects them; the
# boundary loss is disabled (w_boundary: 0).
# =============================================================================

model:
  name: LightPolySegNet
  image_size: 352

  pretrained: true                 # same ImageNet encoder init as ours
  vit_style: timm
  stem_channels: 16
  stage_channels: [24, 48, 64, 80]
  mv2_blocks: [3, 1, 1, 1]
  mv2_expand: 2
  tf_dims: [64, 80, 96]
  tf_depths: [2, 4, 3]
  tf_patch_size: 2
  tf_mlp_ratio: 2.0

  decoder_mode: fpn                # <-- exp10 switch: minimal FPN decoder
  use_boundary_head: false
  use_sobel_attention: false

data:
  aug_color: true

train:
  data_root: data/TrainDataset
  image_size: 352
  val_split: 0.0
  epochs: 100
  batch_size: 8
  lr: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine
  lr_min: 1.0e-6
  warmup_epochs: 2
  amp: true
  num_workers: 2
  grad_clip: 1.0
  seed: 42

  w_bce: 1.0
  w_iou: 1.0
  w_boundary: 0.0
  w_aux: 0.4

  out_dir: runs/exp10
  log_every: 20
  save_every: 5

test:
  data_root: data/TestDataset
  datasets:
    - CVC-300
    - CVC-ColonDB
    - ETIS-Larib
    - Kvasir-SEG
    - CVC-ClinicDB
  threshold: 0.5
