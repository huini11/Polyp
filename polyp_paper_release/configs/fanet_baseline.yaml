# =============================================================================
# Baseline configuration: FANet (Tomar et al. 2021), trained under the SAME
# protocol as our method (PraNet split, 352x352, 100 epochs, bs=8) so that
# Table 2 compares architectures under identical training conditions.
#   train: Kvasir-SEG (1000) + CVC-ClinicDB (612)
#   test : CVC-300 (60) + CVC-ColonDB (380) + ETIS-Larib (196)
#          + Kvasir-SEG + CVC-ClinicDB
# =============================================================================

model:
  # ---- Baseline: FANet (Tomar et al., arXiv:2103.17235, IEEE TNNLS 2022) ----
  # Official architecture (fixed widths, ~7.7M params), no pretrained weights.
  # Ported to src/fanet.py from github.com/nikhilroxtomar/FANet (repo has no
  # LICENSE file; cite the paper when using).
  # Feedback-mask protocol (official): training feeds the previous epoch's
  # binarized prediction as hard attention; eval runs the official 10-pass
  # test-time rectification (handled inside train.py / eval.py).
  name: FANet
  arch: fanet
  in_channels: 3
data:
  # Color-domain augmentation (v2): HSV jitter + brightness/contrast jitter +
  # random gamma, p=0.5, train mode only. Targets the cross-domain color gap
  # (ETIS / CVC-ColonDB). Set to false for the ablation (configs/ablation_no_color.yaml).
  aug_color: true

train:
  # ---- Data ----
  data_root: data/TrainDataset     # contains images/ and masks/
  image_size: 352
  val_split: 0.1                   # fraction held out for model selection.
                                   # For the FINAL paper run use 0.0 (train on all
                                   # 1612 images, PraNet protocol) and keep the
                                   # last checkpoint as the final model.

  # ---- Optimization ----
  epochs: 100
  batch_size: 8                    # fits a free Colab T4 (16GB) at 352x352
  lr: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: adamw
  scheduler: cosine                # cosine annealing to lr_min
  lr_min: 1.0e-6
  warmup_epochs: 2
  amp: true                        # mixed precision on GPU (ignored on CPU)
  num_workers: 2                   # Colab: 2 is safe; increase locally if RAM allows
  grad_clip: 1.0
  seed: 42

  # ---- Loss weights ----
  w_bce: 1.0                       # BCE on main segmentation head
  w_iou: 1.0                       # soft IoU on main segmentation head
  w_boundary: 0.5                  # BCE + Dice on boundary head (boundary GT from
                                   # morphological gradient of the GT mask)
  w_aux: 0.4                       # deep supervision on auxiliary seg maps
                                   # (weight halved at each coarser level)

  # ---- Logging / checkpointing ----
  out_dir: runs/exp1
  log_every: 20                    # steps between console logs
  save_every: 5                    # epochs between periodic snapshots

test:
  data_root: data/TestDataset      # folder with one sub-dataset per test set
  datasets:                        # paper table order
    - CVC-300
    - CVC-ColonDB
    - ETIS-Larib
    - Kvasir-SEG
    - CVC-ClinicDB
  threshold: 0.5
