model:
  name: FANet
  arch: fanet
  in_channels: 3
data:
  aug_color: true
train:
  data_root: data/TrainDataset
  image_size: 352
  val_split: 0.1
  epochs: 100
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  lr_min: 1.0e-06
  warmup_epochs: 2
  amp: true
  num_workers: 2
  grad_clip: 1.0
  seed: 42
  w_bce: 1.0
  w_iou: 1.0
  w_boundary: 0.5
  w_aux: 0.4
  out_dir: runs/fanet
  log_every: 20
  save_every: 5
test:
  data_root: data/TestDataset
  datasets:
  - CVC-300
  - CVC-ColonDB
  - ETIS-Larib
  - Kvasir-SEG
  - CVC-ClinicDB
  threshold: 0.5
